# Publishes the repository root to GitHub Pages on every push to main or preview
# (no build step). docs/changes/010 point 4: main always serves "/", preview always
# serves "/preview/" alongside it - each deploy checks out both branches and combines
# them into one artifact, because a Pages deploy always replaces the whole site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Validate changelog.json (main)
        working-directory: site
        run: python3 -c "import json; d=json.load(open('changelog.json', encoding='utf-8')); e=d['entries'][0]; assert e['version'] and e['title'], 'first entry needs version and title'; print('changelog', e['version'], '-', len(d['entries']), 'entries')"
      - name: Stamp main build with its own commit SHA
        working-directory: site
        run: |
          SHA=$(git rev-parse HEAD)
          sed -i "s/__BUILD__/${SHA:0:7}/g" sw.js app/config.js

      - name: Check whether a preview branch exists
        id: preview
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" preview > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout preview branch
        if: steps.preview.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: preview
          path: site/preview
      - name: Validate changelog.json (preview)
        if: steps.preview.outputs.exists == 'true'
        working-directory: site/preview
        run: python3 -c "import json; d=json.load(open('changelog.json', encoding='utf-8')); e=d['entries'][0]; assert e['version'] and e['title'], 'first entry needs version and title'; print('changelog', e['version'], '-', len(d['entries']), 'entries')"
      - name: Stamp preview build with its own commit SHA
        if: steps.preview.outputs.exists == 'true'
        working-directory: site/preview
        run: |
          SHA=$(git rev-parse HEAD)
          sed -i "s/__BUILD__/${SHA:0:7}/g" sw.js app/config.js

      # Pages deduplicates deployments by pages_build_version, which defaults to the pushed
      # commit. That is wrong here: the site is main + preview combined, so the version has to
      # cover both. Without this, syncing preview onto main's commit (or any other way the two
      # branches end up at the same SHA) makes the next deploy a silent no-op - it reports
      # success in seconds and keeps serving the old content. Cost us an afternoon once.
      - name: Build version from both branches
        id: version
        run: |
          MAIN_SHA=$(git -C site rev-parse HEAD)
          if [ -d site/preview/.git ]; then PREVIEW_SHA=$(git -C site/preview rev-parse HEAD); else PREVIEW_SHA=none; fi
          echo "main $MAIN_SHA / preview $PREVIEW_SHA"
          echo "value=$(printf '%s-%s' "$MAIN_SHA" "$PREVIEW_SHA" | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }} # unique per (re-)run, see docs/changes/008b
      - id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.version.outputs.value }} # the action reads pages_build_version from here
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
