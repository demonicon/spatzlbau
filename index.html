<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://rxhbwjbiwackxuswupuy.supabase.co wss://rxhbwjbiwackxuswupuy.supabase.co; img-src 'self' data:; style-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>Spatzlbau</title>
<meta name="description" content="Spatzlbau – gemeinsamer Umzugsplaner">
<meta name="theme-color" content="#F4F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Spatzlbau">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="wrap">
  <header class="top" id="top">
    <h1 id="title">Spatzlbau</h1>
  </header>

  <!-- docs/changes/013b N3: the wait has the shape of the app - the empty gate bar fills and
       empties again until the data is there. No spinner; without motion three quiet dots. -->
  <section id="loading" class="screen">
    <p class="load-text">Lade …</p>
    <div class="load-gates" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="load-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>

  <section id="login" class="screen" hidden>
    <form id="login-form" class="card" novalidate>
      <label for="login-email">E-Mail-Adresse</label>
      <input type="email" id="login-email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" required>
      <label for="login-password">Passwort</label>
      <div class="pw">
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        <button type="button" class="btn-secondary" id="login-toggle" aria-pressed="false">Anzeigen</button>
      </div>
      <button type="submit" class="btn-primary btn-wide" id="login-submit">Anmelden</button>
      <p id="login-msg" class="msg" role="status"></p>
    </form>
  </section>

  <section id="denied" class="screen" hidden>
    <div class="card">
      <h2>Dieses Konto ist nicht freigeschaltet.</h2>
      <p>Angemeldet als <b id="denied-email"></b>.</p>
      <button type="button" class="btn-secondary btn-wide" id="denied-logout">Abmelden</button>
    </div>
  </section>

  <main id="app" hidden>
    <div id="view"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./app/main.js"></script>
</body>
</html>
