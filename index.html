<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umzug – Sebastian & Anna</title>
<meta name="description" content="Gemeinsamer Umzugsplaner">
<meta name="theme-color" content="#F4F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Umzug">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Umzug – Sebastian &amp; Anna</h1>
    <span class="head-right"><span class="version" id="version"></span><button type="button" class="link" id="logout" hidden>Abmelden</button></span>
  </header>

  <section id="loading" class="screen">Lade …</section>

  <section id="login" class="screen" hidden>
    <form id="login-form" class="card" novalidate>
      <h2>Anmelden</h2>
      <label for="login-email">E-Mail-Adresse</label>
      <input type="email" id="login-email" name="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" required>
      <label for="login-password">Passwort</label>
      <div class="pw">
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        <button type="button" class="btn small" id="login-toggle" aria-pressed="false">Anzeigen</button>
      </div>
      <button type="submit" class="btn primary wide" id="login-submit">Anmelden</button>
      <p id="login-msg" class="msg" role="status"></p>
      <p class="hint">Passwort vergessen? Sebastian setzt es im Supabase-Dashboard zurück.</p>
    </form>
  </section>

  <section id="denied" class="screen" hidden>
    <div class="card">
      <h2>Dieses Konto ist nicht freigeschaltet.</h2>
      <p>Angemeldet als <b id="denied-email"></b>. Für diese Liste sind nur zwei Adressen freigegeben.</p>
      <button type="button" class="btn wide" id="denied-logout">Abmelden</button>
    </div>
  </section>

  <main id="app" hidden>
    <div class="status" id="status" role="status">Verbinde …</div>

    <div class="anchor">
      <div>
        <label for="einzug">Einzugstermin (Schlüsselübergabe neue Wohnung)</label>
        <input type="date" id="einzug">
      </div>
      <div class="progress"><b id="pct">0 %</b><span id="cnt"></span></div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Sichten">
      <button role="tab" data-v="week">Diese Woche</button>
      <button role="tab" data-v="focus">Im Blick</button>
      <button role="tab" data-v="claude">Bei Claude</button>
      <button role="tab" data-v="phases">Phasen</button>
    </nav>
    <div id="view"></div>

    <footer class="bar">
      <button type="button" id="reload">Neu laden</button>
      <button type="button" id="seed-btn">Seed aktualisieren</button>
    </footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./app/main.js"></script>
</body>
</html>
